<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Konazin</title>
  <style>
    :root{color-scheme:dark;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#080b10;color:#f2f5f7}.box{width:min(560px,calc(100% - 32px));padding:42px;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:#111721}.code{color:#82f7c3;font-size:13px}h1{font:700 clamp(42px,10vw,78px)/1 system-ui;margin:18px 0;letter-spacing:-.06em}p{color:#8b97a8;line-height:1.7}a{display:inline-flex;margin-top:18px;padding:12px 16px;border-radius:10px;background:#f2f5f7;color:#080b10;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main class="box">
    <span class="code">HTTP 404 / route_not_found</span>
    <h1>Essa rota não existe.</h1>
    <p>Provavelmente um link quebrado, uma URL digitada às pressas ou mais uma pequena contribuição humana ao caos.</p>
    <a href="/">Voltar ao portfólio</a>
  </main>

</html>
